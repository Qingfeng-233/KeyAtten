[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keyatten"
version = "0.2.0"
description = "Attention-based keyword extraction with ordered semantic word weights"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "蒋林浩" },
]
keywords = ["keyword extraction", "keyphrase extraction", "attention", "NLP", "transformer", "unsupervised"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/Qingfeng-233/KeyAtten"
Repository = "https://github.com/Qingfeng-233/KeyAtten"
Issues = "https://github.com/Qingfeng-233/KeyAtten/issues"

[project.scripts]
keyatten-benchmark = "keyatten.benchmark_cli:main"

[project.optional-dependencies]
inference = [
    "torch>=2.0",
    "transformers>=4.30",
]
bio = [
    "torch>=2.0",
    "transformers>=4.30",
    "pytorch-crf>=0.7",
]
lightweight = [
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "tokenizers>=0.15",
]
zh = [
    "jieba>=0.42",
]
en = [
    "scikit-learn>=1.0",
    "nltk>=3.8",
]
full = [
    "torch>=2.0",
    "transformers>=4.30",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "tokenizers>=0.15",
    "jieba>=0.42",
    "scikit-learn>=1.0",
    "nltk>=3.8",
    "pytorch-crf>=0.7",
]

[tool.setuptools]
include-package-data = true
packages = [
    "keyatten",
    "keyatten._archive",
    "keyatten._archive.ppc",
    "keyatten.candidates",
    "keyatten.extractors",
    "keyatten.scoring",
]

[tool.setuptools.package-dir]
keyatten = "src"
